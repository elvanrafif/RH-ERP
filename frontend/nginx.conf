server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Aktifkan kompresi gzip — bundle awal ~450KB jadi jauh lebih kecil saat ditransfer.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # SPA routing — semua route dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html tidak boleh di-cache (agar update langsung terpakai)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache assets statis (berhash Vite — aman immutable 1 tahun)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
